apiVersion: ironic.openstack.org/v1beta1
kind: Ironic
metadata:
  name: ironic
spec:
  serviceUser: ironic
  secret: osp-secret
  customServiceConfig: |
    [DEFAULT]
    debug = true
  databaseInstance: openstack
  storageClass: local-storage
  ironicAPI:
    tls:
      api:
        internal:
          secretName: cert-ironic-internal-svc
        public:
          secretName: cert-ironic-public-svc
      caBundleSecretName: combined-ca-bundle
  ironicConductors:
  - storageRequest: 10G
  ironicNeutronAgent:
    customServiceConfig: |
      [DEFAULT]
      debug = true
