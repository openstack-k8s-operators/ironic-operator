{{- define "auth_config" -}}
auth_url={{ .KeystoneInternalURL }}
{{ if .UseApplicationCredentials -}}
auth_type=v3applicationcredential
application_credential_id = {{ .ACID }}
application_credential_secret = {{ .ACSecret }}
{{- else -}}
auth_type=password
username={{ .ServiceUser }}
password = {{ .ServicePassword }}
user_domain_name=Default
project_name=service
project_domain_name=Default
{{- end }}
{{ if (index . "Region") -}}
region_name={{ .Region }}
{{ end -}}
{{- end -}}

[DEFAULT]
auth_strategy = keystone
transport_url = {{ .TransportURL }}

[keystone_authtoken]
www_authenticate_uri={{ .KeystonePublicURL }}
{{ template "auth_config" . }}

[service_catalog]
{{ template "auth_config" . }}

[ironic]
{{ template "auth_config" . }}

[agent]
report_interval=30

{{ if (index . "QuorumQueues") }}
[oslo_messaging_rabbit]
rabbit_quorum_queue=true
rabbit_transient_quorum_queue=true
amqp_durable_queues=true
{{ end }}

{{ if (index . "NotificationsTransportURL") }}
{{ if ne (index . "NotificationsTransportURL") (index . "TransportURL") }}
[oslo_messaging_notifications]
driver = messagingv2
transport_url = {{ index . "NotificationsTransportURL" }}
{{ end }}
{{ end }}

[baremetal_agent]
# https://bugs.launchpad.net/networking-baremetal/+bug/2145022
enable_ha_chassis_group_alignment = False

[l2vni]
{{ if (index . "DisableL2VNI") }}
enable_l2vni_trunk_reconciliation = False
{{ else }}
enable_l2vni_trunk_reconciliation = True
{{ end }}

{{ if (index . "NBConnection") }}
ovn_nb_connection = {{ .NBConnection }}
ovn_sb_connection = {{ .SBConnection }}
{{ end }}

{{ if (index . "OVNDB_TLS") }}
[ovn]
ovn_nb_private_key = /etc/pki/tls/private/ovndb.key
ovn_nb_certificate = /etc/pki/tls/certs/ovndb.crt
ovn_nb_ca_cert = /etc/pki/tls/certs/ovndbca.crt
ovn_sb_private_key = /etc/pki/tls/private/ovndb.key
ovn_sb_certificate = /etc/pki/tls/certs/ovndb.crt
ovn_sb_ca_cert = /etc/pki/tls/certs/ovndbca.crt
{{ end }}
